<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a3a5c">
  <title>Puritan Gold</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%231a3a5c'/><text x='90' y='118' font-size='96' text-anchor='middle' fill='%23e8b84a' font-weight='bold'>P</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-row">
        <h1>PURITAN GOLD</h1>
        <div class="streak" id="streak">
          <span class="streak-fire">🔥</span><span id="streakCount">0</span>
        </div>
      </div>
      <p class="subtitle">Theology for the Soul</p>
      <div class="month-pill">MARCH 2026</div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-view="episodes">Episodes</button>
      <button class="tab" data-view="calendar">Calendar</button>
    </nav>

    <div class="filters" id="filters">
      <button class="pill active" data-filter="all">All</button>
      <button class="pill" data-filter="unplayed">Unplayed</button>
      <button class="pill" data-filter="started">Started</button>
      <button class="pill" data-filter="done">Done</button>
    </div>

    <main class="content">
      <section class="view episodes-view active" id="episodesView">
        <div id="episodeList" class="episode-list">
          <div class="skeleton-list" id="skeletons">
            <div class="sk-card"><div class="sk sk-num"></div><div class="sk-body"><div class="sk sk-title"></div><div class="sk sk-sub"></div><div class="sk sk-badge"></div></div></div>
            <div class="sk-card"><div class="sk sk-num"></div><div class="sk-body"><div class="sk sk-title"></div><div class="sk sk-sub"></div><div class="sk sk-badge"></div></div></div>
            <div class="sk-card"><div class="sk sk-num"></div><div class="sk-body"><div class="sk sk-title"></div><div class="sk sk-sub"></div><div class="sk sk-badge"></div></div></div>
            <div class="sk-card"><div class="sk sk-num"></div><div class="sk-body"><div class="sk sk-title"></div><div class="sk sk-sub"></div><div class="sk sk-badge"></div></div></div>
          </div>
        </div>
      </section>
      <section class="view calendar-view" id="calendarView">
        <div class="cal-container">
          <div class="cal-month-nav">
            <span class="cal-month-label">March 2026</span>
          </div>
          <div class="cal-header">
            <div class="cal-dow">Su</div>
            <div class="cal-dow">Mo</div>
            <div class="cal-dow">Tu</div>
            <div class="cal-dow">We</div>
            <div class="cal-dow">Th</div>
            <div class="cal-dow">Fr</div>
            <div class="cal-dow">Sa</div>
          </div>
          <div class="cal-grid" id="calGrid"></div>
        </div>
        <div class="cal-detail" id="calDetail">
          <div class="cal-detail-empty">Tap a day to see the episode</div>
        </div>
      </section>
    </main>

    <!-- Mini Player -->
    <div class="mini-player" id="miniPlayer">
      <div class="mp-progress"><div class="mp-fill" id="mpFill"></div></div>
      <div class="mp-body">
        <div class="mp-info" onclick="App.openNowPlaying()">
          <div class="mp-title" id="mpTitle">Select an episode</div>
          <div class="mp-sub" id="mpSub">Tap to begin</div>
        </div>
        <div class="mp-ctrls">
          <button class="mp-btn" onclick="App.skipBack()" aria-label="Back 15s">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="15.5" font-size="7" text-anchor="middle" font-weight="bold">15</text></svg>
          </button>
          <button class="mp-btn mp-play" id="mpPlayBtn" onclick="App.togglePlay()" aria-label="Play">
            <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 20,12 8,19"/></svg>
          </button>
          <button class="mp-btn" onclick="App.skipForward()" aria-label="Forward 30s">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="15.5" font-size="7" text-anchor="middle" font-weight="bold">30</text></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Now Playing Fullscreen -->
  <div class="now-playing" id="nowPlaying">
    <div class="np-top">
      <button class="np-close" onclick="App.closeNowPlaying()" aria-label="Minimize">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
      </button>
      <span class="np-label">Now Playing</span>
      <button class="np-speed-top" id="npSpeedTop" onclick="App.cycleSpeed()">1x</button>
    </div>
    <div class="np-scroll">
      <div class="np-art"><span>P</span></div>
      <h2 class="np-title" id="npTitle"></h2>
      <p class="np-series" id="npSeries"></p>
      <div class="np-scrub">
        <div class="np-track" id="npTrack">
          <div class="np-track-fill" id="npTrackFill"></div>
          <div class="np-thumb" id="npThumb"></div>
        </div>
        <div class="np-times">
          <span id="npElapsed">0:00</span>
          <span id="npRemain">-0:00</span>
        </div>
      </div>
      <div class="np-controls">
        <button class="np-ctrl" onclick="App.skipBack()" aria-label="Back 15s">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="15.5" font-size="7" text-anchor="middle" font-weight="bold">15</text></svg>
        </button>
        <button class="np-ctrl np-play-main" id="npPlayBtn" onclick="App.togglePlay()" aria-label="Play">
          <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="8,5 20,12 8,19"/></svg>
        </button>
        <button class="np-ctrl" onclick="App.skipForward()" aria-label="Forward 30s">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="15.5" font-size="7" text-anchor="middle" font-weight="bold">30</text></svg>
        </button>
      </div>
      <div class="np-options">
        <button class="np-opt" onclick="App.openSleepModal()">
          <span class="np-opt-icon">🌙</span>
          <span class="np-opt-text" id="npSleepText">Sleep Timer</span>
        </button>
        <button class="np-opt" onclick="App.toggleAutoplay()">
          <span class="np-opt-icon" id="npAutoIcon">⏭</span>
          <span class="np-opt-text" id="npAutoText">Auto-play: On</span>
        </button>
      </div>
      <div class="np-desc" id="npDesc"></div>
    </div>
  </div>

  <!-- Sleep Timer Modal -->
  <div class="modal-bg" id="sleepModal" onclick="App.closeSleepModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h3 class="modal-h">Sleep Timer</h3>
      <button class="modal-opt" onclick="App.setSleep(15)">15 minutes</button>
      <button class="modal-opt" onclick="App.setSleep(30)">30 minutes</button>
      <button class="modal-opt" onclick="App.setSleep(45)">45 minutes</button>
      <button class="modal-opt" onclick="App.setSleep(60)">1 hour</button>
      <button class="modal-opt" onclick="App.setSleep(-1)">End of episode</button>
      <button class="modal-opt cancel" id="sleepCancelBtn" onclick="App.setSleep(0)">Cancel Timer</button>
      <button class="modal-opt done" onclick="App.closeSleepModal()">Close</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
