<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#1a3a5c">
  <title>Puritan Gold</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='36' fill='%231a3a5c'/><text x='90' y='118' font-size='96' text-anchor='middle' fill='%23e8b84a' font-weight='bold'>P</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>PURITAN GOLD</h1>
      <div class="subtitle">Theology for the Soul</div>
      <div class="month-label">MARCH 2026</div>
    </div>

    <div class="tabs">
      <button class="tab active" data-view="episodes">Episodes</button>
      <button class="tab" data-view="schedule">Weekly Plan</button>
    </div>

    <div class="episode-list-view active">
      <div class="episode-list">
        <div class="loading">Loading episodes...</div>
      </div>
    </div>

    <div class="schedule-view"></div>

    <div class="player-bar">
      <div class="player-progress-bar">
        <div class="player-progress-fill"></div>
      </div>
      <div class="player-content">
        <div class="player-info">
          <div class="player-title">Not playing</div>
          <div class="player-time">0:00</div>
        </div>
        <div class="player-controls">
          <button class="player-btn speed-btn" onclick="App.cycleSpeed()" title="Playback speed">1x</button>
          <button class="player-btn" onclick="App.skipBack()" title="Back 15s">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="15.5" font-size="7" text-anchor="middle" font-weight="bold">15</text></svg>
          </button>
          <button class="player-btn play-btn" onclick="App.togglePlay()">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><polygon points="6,4 20,12 6,20"/></svg>
          </button>
          <button class="player-btn" onclick="App.skipForward()" title="Forward 30s">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="15.5" font-size="7" text-anchor="middle" font-weight="bold">30</text></svg>
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
