<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#121212">
  <title>Puritan Gold</title>
  <meta property="og:title" content="Puritan Gold — Listen">
  <meta property="og:description" content="Theology for the Soul">
  <meta property="og:type" content="music.song">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #121212; --card: #1e1e1e; --gold: #d4a23c; --gold-light: #e8cb7a;
      --text: #fff; --text2: #b3b3b3; --text3: #727272; --border: #282828;
      --green: #1DB954; --surface: #242424;
    }
    html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .share-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .share-brand { font-size: 12px; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 32px; }
    .share-card { background: var(--card); border-radius: 20px; padding: 32px 28px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 8px 40px rgba(0,0,0,0.5); }
    .share-art { width: 120px; height: 120px; border-radius: 16px; background: linear-gradient(135deg, #1a3a5c, #2a5a8c); display: flex; align-items: center; justify-content: center; font-size: 52px; font-weight: 700; color: var(--gold); margin: 0 auto 20px; }
    .share-section { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--gold); margin-bottom: 6px; }
    .share-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; line-height: 1.3; }
    .share-date { font-size: 13px; color: var(--text3); margin-bottom: 20px; }
    .share-scrub { width: 100%; margin-bottom: 6px; }
    .share-track { width: 100%; height: 4px; background: var(--border); border-radius: 4px; cursor: pointer; position: relative; }
    .share-fill { height: 100%; background: var(--gold); border-radius: 4px; width: 0%; transition: width 0.3s; }
    .share-times { display: flex; justify-content: space-between; font-size: 11px; color: var(--text3); margin-bottom: 16px; }
    .share-controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
    .share-btn { background: none; border: none; color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .share-play { width: 56px; height: 56px; border-radius: 50%; background: var(--gold); color: #000; display: flex; align-items: center; justify-content: center; border: none; cursor: pointer; transition: transform 0.15s; }
    .share-play:active { transform: scale(0.92); }
    .share-skip svg { width: 28px; height: 28px; }
    .share-speed { font-size: 13px; font-weight: 700; color: var(--text2); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 4px 10px; cursor: pointer; }
    .share-open { display: block; margin-top: 16px; padding: 12px 24px; background: var(--gold); color: #000; border: none; border-radius: 24px; font-size: 14px; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; transition: opacity 0.15s; width: 100%; }
    .share-open:active { opacity: 0.85; }
    .share-loading { color: var(--text3); font-size: 15px; }
    .share-error { color: var(--text3); font-size: 15px; }
  </style>
</head>
<body>
  <div class="share-page">
    <div class="share-brand">PURITAN GOLD</div>
    <div class="share-card" id="shareCard">
      <div class="share-loading" id="shareLoading">Loading episode...</div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const epId = parseInt(params.get('ep'));
    let audio = null;
    let speeds = [0.75, 1, 1.25, 1.5, 2];
    let speedIdx = 1;

    function formatTime(s) {
      if (!s || isNaN(s)) return '0:00';
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return m + ':' + (sec < 10 ? '0' : '') + sec;
    }

    async function init() {
      if (!epId) {
        document.getElementById('shareLoading').textContent = 'No episode specified.';
        return;
      }

      try {
        const res = await fetch('../episodes.json?' + Date.now());
        const episodes = await res.json();
        const ep = episodes.find(e => e.id === epId);
        if (!ep) {
          document.getElementById('shareLoading').textContent = 'Episode not found.';
          return;
        }

        // Update OG tags
        document.title = ep.title + ' — Puritan Gold';

        const sectionLabels = { study: 'Study', family: 'Family Devotional', school: 'School', together: 'Together', personal: 'Personal Growth' };
        const sectionLabel = sectionLabels[ep.section] || 'Study';

        const card = document.getElementById('shareCard');
        card.innerHTML = `
          <div class="share-art">P</div>
          <div class="share-section">${sectionLabel}</div>
          <div class="share-title">${ep.title}</div>
          <div class="share-date">${ep.date || ''} · ${ep.duration || ''}</div>
          <div class="share-scrub">
            <div class="share-track" id="shareTrack" onclick="seek(event)">
              <div class="share-fill" id="shareFill"></div>
            </div>
          </div>
          <div class="share-times">
            <span id="shareElapsed">0:00</span>
            <span id="shareRemain">-0:00</span>
          </div>
          <div class="share-controls">
            <button class="share-speed" id="shareSpeed" onclick="cycleSpeed()">1x</button>
            <button class="share-btn share-skip" onclick="skip(-15)">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="12" y="15.5" font-size="7" text-anchor="middle" font-weight="bold">15</text></svg>
            </button>
            <button class="share-play" id="sharePlay" onclick="togglePlay()">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><polygon points="8,5 20,12 8,19"/></svg>
            </button>
            <button class="share-btn share-skip" onclick="skip(30)">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="12" y="15.5" font-size="7" text-anchor="middle" font-weight="bold">30</text></svg>
            </button>
            <button class="share-speed" style="visibility:hidden">1x</button>
          </div>
          <a class="share-open" href="index.html">Open in Puritan Gold</a>
        `;

        // Set up audio
        if (ep.file) {
          audio = new Audio('../' + ep.file);
          audio.addEventListener('timeupdate', updateProgress);
          audio.addEventListener('ended', () => updatePlayIcon(false));
        }
      } catch (e) {
        document.getElementById('shareLoading').textContent = 'Could not load episode.';
      }
    }

    function togglePlay() {
      if (!audio) return;
      if (audio.paused) {
        audio.play();
        updatePlayIcon(true);
      } else {
        audio.pause();
        updatePlayIcon(false);
      }
    }

    function updatePlayIcon(playing) {
      const btn = document.getElementById('sharePlay');
      if (!btn) return;
      btn.innerHTML = playing
        ? '<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>'
        : '<svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor"><polygon points="8,5 20,12 8,19"/></svg>';
    }

    function updateProgress() {
      if (!audio) return;
      const pct = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
      const fill = document.getElementById('shareFill');
      if (fill) fill.style.width = pct + '%';
      const el = document.getElementById('shareElapsed');
      const rem = document.getElementById('shareRemain');
      if (el) el.textContent = formatTime(audio.currentTime);
      if (rem) rem.textContent = '-' + formatTime(audio.duration - audio.currentTime);
    }

    function seek(e) {
      if (!audio || !audio.duration) return;
      const track = document.getElementById('shareTrack');
      const rect = track.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      audio.currentTime = pct * audio.duration;
    }

    function skip(sec) {
      if (!audio) return;
      audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + sec));
    }

    function cycleSpeed() {
      speedIdx = (speedIdx + 1) % speeds.length;
      if (audio) audio.playbackRate = speeds[speedIdx];
      const btn = document.getElementById('shareSpeed');
      if (btn) btn.textContent = speeds[speedIdx] + 'x';
    }

    init();
  </script>
</body>
</html>
